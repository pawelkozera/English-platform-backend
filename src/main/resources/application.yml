spring:
  config:
    import: classpath:token.properties

  application:
    name: english

  datasource:
    url: jdbc:postgresql://localhost:5432/english
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    database: POSTGRESQL
    hibernate:
      ddl-auto: update

  web:
    resources:
      add-mappings: false

  jackson:
    time-zone: UTC

token:
  signing:
    key: ${token.key}

server:
  port: 8080
  error:
    include-stacktrace: never
    whitelabel:
      enabled: false
